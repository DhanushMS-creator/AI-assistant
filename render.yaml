services:
  # Backend (FastAPI)
  - type: web
    name: api
    env: python
    region: singapore
    plan: free
    buildCommand: |
      pip install -r server/requirements.txt
    startCommand: |
      cd server && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DATABASE_URL
        fromDatabase:
          name: db
          property: connectionString
    autoDeploy: true

# Frontend (React)
staticSites:
  - name: web
    # env: static # 'env' is implied for staticSites
    region: singapore
    plan: free
    buildCommand: |
      cd client-react
      npm install
      npm run build
    staticPublishPath: client-react/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: api
          envVar: RenderServiceUrl
    autoDeploy: true

databases:
  - name: db
    region: singapore
    plan: free
    databaseName: app_db
    user: app_user

version: "1"

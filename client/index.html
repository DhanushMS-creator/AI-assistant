<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Assistant</title>
    <link rel="stylesheet" href="style.css?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-glow"></div>
    
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <h2>NOVA</h2>
            </div>
            <div class="new-chat-container">
                <button id="new-chat-btn" class="new-chat-btn">+ New Chat</button>
            </div>
            <div class="history-list" id="history-list">
                <!-- History Items injected here -->
                <div class="history-item loading">Loading...</div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <div class="header-title">Your AI Companion</div>
                <div class="profile-section">
                    <div class="profile-pic" id="profile-pic">
                        <span>U</span> 
                        <!-- Img will be injected if available -->
                    </div>
                    <div class="profile-dropdown" id="profile-dropdown">
                        <button id="logout-btn">Logout</button>
                    </div>
                </div>
            </header>

            <div class="assistant-interface">
                <div id="visualizer" class="visualizer">
                    <div class="circle"></div>
                    <div class="circle"></div>
                    <div class="circle"></div>
                </div>
                
                <div id="status-text" class="status">Tap microphone to start (Live)</div>

                <div class="controls">
                    <button id="mic-btn" class="mic-button">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                        </svg>
                    </button>
                </div>
            </div>
            
            <div id="conversation-log" class="conversation-log">
                <!-- Messages will appear here -->
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
